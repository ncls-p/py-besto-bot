[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-besto-bot"
version = "0.1.0"
description = "Discord bot with AI capabilities"
requires-python = ">=3.13"
dependencies = [
    "discord.py>=2.3.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "basedpyright>=1.1.0",
    "black>=23.0.0",
    "hypothesis>=6.100.0",
    "freezegun>=1.2.0",
    "types-requests>=2.31.0",
]

[tool.black]
line-length = 100
target-version = ['py313']
skip-string-normalization = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG"]
ignore = ["B008", "B014", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    "unit: Unit tests - Fast, isolated tests of individual components",
    "integration: Integration tests - Tests that interact with multiple components",
    "slow: Slow running tests - May take more than 1 second",
    "async: Async tests - Tests using async/await",
    "requires_api: Tests that require external API access",
    "parametrize: Tests with parameterized inputs",
    "edge_cases: Tests for edge cases and error conditions",
]

[tool.basedpyright]
include = ["src", "tests"]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeArgument = "warning"
reportUnknownParameterType = "warning"
reportUnusedFunction = "warning"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportMissingParameterType = "warning"
reportUnusedVariable = "warning"
reportUnknownArgumentType = "warning"
reportUnusedImport = "warning"
reportOptionalMemberAccess = "warning"