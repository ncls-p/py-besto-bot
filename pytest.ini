[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    async: Async tests
    requires_api: Tests that require API access

[coverage:run]
source = src
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
