[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    async: Async tests
    requires_api: Tests that require API access
